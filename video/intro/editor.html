<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>tadgobble — intro edit</title>
  <style>
    @font-face {
      font-family: Bricolage;
      src: url('/public/fonts/font-1.woff2');
      font-weight: 400 800;
    }
    @font-face {
      font-family: DM;
      src: url('/public/fonts/font-2.woff2');
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #21162f;
      color: #fffef6;
      font-family: DM, sans-serif;
      display: grid;
      grid-template-columns: 1fr 350px;
      min-height: 100vh;
    }
    .stage {
      height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
    }
    canvas#film {
      height: calc(100vh - 40px);
      max-width: 100%;
      aspect-ratio: 9/16;
      object-fit: contain;
      box-shadow: 0 20px 90px #0005;
    }
    aside {
      padding: 48px 32px;
      border-left: 1px solid #ffffff21;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 {
      font: 700 44px/1 Bricolage;
      margin: 0;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #c5b5f5;
    }
    button {
      padding: 15px 22px;
      background: #f9f4a7;
      border: 0;
      border-radius: 999px;
      color: #39245a;
      font: 700 15px DM;
      cursor: pointer;
    }
    input {
      width: 100%;
      accent-color: #ff7547;
    }
    .time {
      font-variant-numeric: tabular-nums;
      font-size: 28px;
    }
    label {
      font-size: 13px;
    }
    .scenes {
      display: grid;
      gap: 8px;
    }
    .scenes button {
      text-align: left;
      border-radius: 8px;
      padding: 10px 14px;
      background: #ffffff0c;
      color: #f9f4a7;
      font-size: 12px;
    }
    small {
      margin-top: auto;
      color: #b9a8d0;
      line-height: 1.6;
    }
    @media (max-width: 700px) {
      body {
        display: block;
      }
      .stage {
        height: 80vh;
      }
      canvas#film {
        height: 76vh;
      }
      aside {
        padding: 24px;
      }
      .scenes {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
  <main class="stage"><canvas id="film" width="1080" height="1920"></canvas></main>
  <aside>
    <div>THE INTRO EDIT / 01</div>
    <h1>A better<br />rabbit hole.</h1>
    <p>
      40 seconds. Real UI takes, camera choreography, kinetic captions, AI voiceover, and an
      original score.
    </p>
    <button id="play">Play the edit ↗</button>
    <div class="time" id="time">00:00.00</div>
    <input
      id="scrub"
      type="range"
      min="0"
      max="39.98"
      step="0.0166667"
      value="0"
      aria-label="Timeline"
    /><label
      ><input type="checkbox" id="captions" checked style="width: auto" /> Show kinetic
      captions</label
    >
    <div class="scenes" id="scenes"></div>
    <small
      >Demo catalog. The public tadgobble catalog is unchanged.<br />AI-generated narration: OpenAI
      Marin.<br />Source: video/intro/composition.js</small
    >
  </aside>
  <audio id="audio" src="/data/intro/master.wav" preload="auto"></audio>
  <script type="module" src="/video/intro/composition.js"></script>
</html>
